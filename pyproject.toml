[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siftool"
version = "2.0.0.dev0"
description = "Lossless, offline image metadata cleaner with verified results"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "Pillow>=10", "pytest-qt>=4.4"]
legacy = ["Pillow>=10", "piexif>=1.1.3", "tkinterdnd2>=0.3.0"]
gui = ["PySide6>=6.7", "PySide6-Fluent-Widgets>=1.7"]

[project.scripts]
siftool = "siftool.cli:main"

[project.gui-scripts]
siftool-gui = "siftool_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
qt_api = "pyside6"
