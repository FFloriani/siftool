[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siftool"
dynamic = ["version"]  # siftool.__version__, the one source of truth (distribution spec 2)
description = "Lossless, offline image metadata cleaner with verified results"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "Pillow>=10", "pytest-qt>=4.4"]
legacy = ["Pillow>=10", "piexif>=1.1.3", "tkinterdnd2>=0.3.0"]
gui = ["PySide6>=6.10,<7", "PySide6-Fluent-Widgets>=1.11,<2"]
build = ["pyinstaller>=6.16"]  # packaging/build.py: `pip install -e ".[gui,build]"`; Inno Setup 6 is installed apart

[project.scripts]
siftool = "siftool.cli:main"

[project.gui-scripts]
siftool-gui = "siftool_gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "siftool.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siftool_gui = ["assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
qt_api = "pyside6"
